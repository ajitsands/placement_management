<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Candidate Placement & Claims Management System - Enterprise web application built with React, PHP MVC, and MySQL for the Kingdom of Bahrain and GCC.">
  <meta name="author" content="SaNDS Lab W.L.L.">
  <title>Candidate Placement & Claims Management System | SaNDS Lab</title>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Core Design System Stylesheet -->
  <link rel="stylesheet" href="css/app.css?v=8.0">

  <!-- React 18 & ReactDOM 18 Production UMD -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- SweetAlert2 (Local distribution with CDN fallback) -->
  <script defer src="js/sweetalert2.all.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      if (typeof Swal === 'undefined') {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/sweetalert2@11';
        s.onload = function() { window.swal = window.Swal; };
        document.head.appendChild(s);
      } else {
        window.swal = window.Swal;
      }
    });
  </script>
</head>
<body>
  <!-- React App Root Container with Instant Boot Loader -->
  <div id="root">
    <style>
      @keyframes sandsBootSpin { to { transform: rotate(360deg); } }
      .sands-boot-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8fafc;
        color: #0f172a;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .sands-boot-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(37, 99, 235, 0.18);
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: sandsBootSpin 0.8s linear infinite;
      }
    </style>
    <div class="sands-boot-loader">
      <div class="sands-boot-spinner"></div>
      <div style="font-weight:700;font-size:15px;color:#1e293b;">Loading Placement &amp; Claims Portal...</div>
      <div style="font-size:12px;color:#64748b;">Initializing workspace components</div>
    </div>
  </div>

  <!-- Micro-API Client -->
  <script src="js/services/api.js?v=8.10"></script>

  <!-- Central State Management Store -->
  <script src="js/state/store.js?v=9.3"></script>

  <!-- Fast Parallel + IndexedDB-Cached JSX Loader -->
  <script src="js/babel-cache-loader.js?v=1.1"></script>
  <script>
    window.loadAppJSXScripts([
      'js/components/DataTable.js?v=8.2',
      'js/components/Navbar.js?v=8.8',
      'js/components/InterviewModals.js?v=1.3',
      'js/components/Modals.js?v=9.33',
      'js/views/LoginView.js?v=8.2',
      'js/views/DashboardView.js?v=8.5',
      'js/views/CandidatesView.js?v=9.7',
      'js/views/JobsView.js?v=9.2',
      'js/views/EventsView.js?v=1.6',
      'js/views/PlacementsView.js?v=9.3',
      'js/views/MilestonesView.js?v=8.6',
      'js/views/ClaimsView.js?v=8.8',
      'js/views/DisputesView.js?v=8.10',
      'js/views/PaymentsView.js?v=8.8',
      'js/views/MonthlyReportsView.js?v=1.2',
      'js/views/ReportsView.js?v=8.9',
      'js/views/UsersView.js?v=8.2',
      'js/views/SettingsView.js?v=8.2',
      'js/views/ProfileView.js?v=8.2',
      'js/app.js?v=8.4'
    ]).catch(function(err) {
      console.error('App boot failed:', err);
      var root = document.getElementById('root');
      if (root) {
        root.innerHTML = '<div style="padding:2rem;text-align:center;font-family:sans-serif;color:#b91c1c;"><h3>Failed to load application</h3><p>' + (err && err.message ? err.message : 'Please refresh the page.') + '</p></div>';
      }
    });
  </script>
</body>
</html>
